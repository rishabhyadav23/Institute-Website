spring:
  application:
    name: institute-backend

  # Default profile: local development with PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/institute_db
    username: rishabh
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong2026
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:your-google-client-id-here}
    apple:
      client-id: ${APPLE_CLIENT_ID:your-apple-client-id-here}

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}

---
# H2 profile (for quick local testing without PostgreSQL)
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:institute_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
